<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Floppy Flight VR - Meta Quest 3</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪶</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #4dc1f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Desktop Info Banner */
    #desktop-overlay {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 14px 28px;
      border-radius: 30px;
      color: #ffffff;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #desktop-overlay h1 {
      font-size: 20px;
      margin-bottom: 4px;
      color: #fbc531;
      letter-spacing: 1px;
    }

    #desktop-overlay p {
      font-size: 13px;
      opacity: 0.9;
    }

    /* Custom VR Button style */
    #vr-button {
      position: absolute !important;
      bottom: 30px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      background: #44bd32 !important;
      color: #ffffff !important;
      font-weight: bold !important;
      font-size: 18px !important;
      padding: 14px 32px !important;
      border-radius: 40px !important;
      border: 3px solid #ffffff !important;
      box-shadow: 0 6px 25px rgba(68, 189, 50, 0.6) !important;
      cursor: pointer !important;
      text-transform: uppercase !important;
      letter-spacing: 1.5px !important;
      transition: transform 0.15s ease, background 0.15s ease !important;
      z-index: 9999 !important;
    }

    #vr-button:hover {
      background: #4cd137 !important;
      transform: translateX(-50%) scale(1.05) !important;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BNC4xFz5.js"></script>
</head>
<body>
  <div id="desktop-overlay">
    <h1>🪶 FLOPPY FLIGHT VR</h1>
    <p><b>Meta Quest 3:</b> Click <b>ENTER VR</b> below & flap controllers down to fly!</p>
    <p style="margin-top: 3px; font-size: 12px; color: #a4b0be;">(Desktop Preview: Click or press <b>SPACE</b> to flap)</p>
  </div>

  <div id="app"></div>

</body>
</html>
