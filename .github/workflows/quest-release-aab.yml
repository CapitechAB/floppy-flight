name: Quest release APK

on:
  workflow_dispatch:
    inputs:
      package:
        description: Release package. The Horizon dashboard accepts a signed APK.
        type: choice
        default: apk
        options:
          - apk
          - aab
  push:
    branches: [main]
    paths:
      - "unity/**"
      - ".github/workflows/quest-release-aab.yml"

permissions:
  contents: read

jobs:
  build:
    name: Signed Quest release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-quest-android-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-quest-android-

      - name: Build signed release
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.0.83f1
          targetPlatform: Android
          buildName: FloppyFlight
          buildsPath: build
          buildMethod: ${{ github.event.inputs.package == 'aab' && 'FloppyFlight.Editor.BuildScript.BuildAndroidAab' || 'FloppyFlight.Editor.BuildScript.BuildAndroidApk' }}
          androidExportType: ${{ github.event.inputs.package == 'aab' && 'androidAppBundle' || 'androidPackage' }}
          androidVersionCode: ${{ github.run_number }}
          versioning: None
          androidKeystoreName: floppy-flight-release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          customParameters: -metaAppId ${{ secrets.META_APP_ID }}

      - name: Upload APK artifact
        if: github.event.inputs.package != 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: FloppyFlight-Quest-release-apk
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB artifact
        if: github.event.inputs.package == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: FloppyFlight-Quest-release-aab
          path: build/**/*.aab
          if-no-files-found: error
          retention-days: 14
